<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>约会预约 · 专属邀请函</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=Noto+Serif+SC:wght@400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
<style>
/* ============ 基础重置 ============ */
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html { scroll-behavior:smooth; }
body {
  font-family:'Noto Sans SC','Cormorant Garamond',sans-serif;
  background:#FFF8F5;
  color:#4A1942;
  overflow-x:hidden;
  min-height:100vh;
}
img,svg{display:block;}
button{font-family:inherit;border:none;background:none;cursor:pointer;}
input,textarea{font-family:inherit;}
::selection{background:#E85D75;color:#fff;}

/* ============ 设计变量 ============ */
:root{
  --cream:#FFF8F5;
  --blush:#FFE1E8;
  --blush-deep:#FFC6D3;
  --rose:#E85D75;
  --rose-deep:#C9184A;
  --plum:#4A1942;
  --plum-soft:#7A4266;
  --gold:#D4A373;
  --gold-light:#F1E3D3;
  --glass-bg:rgba(255,255,255,0.55);
  --glass-border:rgba(255,255,255,0.7);
  --shadow-soft:0 20px 60px rgba(201,24,74,0.14);
  --shadow-deep:0 30px 80px rgba(74,25,66,0.22);
  --ease:cubic-bezier(0.22,1,0.36,1);
  --font-display:'Cormorant Garamond','Noto Serif SC',serif;
  --font-display-cn:'Noto Serif SC',serif;
  --font-body:'Noto Sans SC',sans-serif;
}

/* ============ 页面载入动画 ============ */
#loader{
  position:fixed;inset:0;z-index:9999;
  background:linear-gradient(160deg,var(--cream),var(--blush));
  display:flex;align-items:center;justify-content:center;flex-direction:column;gap:18px;
  transition:opacity 1s var(--ease), visibility 1s var(--ease);
}
#loader.hide{opacity:0;visibility:hidden;pointer-events:none;}
.loader-heart{
  width:46px;height:46px;position:relative;animation:loaderBeat 1.1s ease-in-out infinite;
}
.loader-heart::before,.loader-heart::after{
  content:'';position:absolute;width:26px;height:40px;background:var(--rose-deep);border-radius:26px 26px 0 0;top:0;
}
.loader-heart::before{left:23px;transform:rotate(-45deg);transform-origin:0 100%;}
.loader-heart::after{left:-3px;transform:rotate(45deg);transform-origin:100% 100%;}
@keyframes loaderBeat{0%,100%{transform:scale(1);}50%{transform:scale(0.85);}}
.loader-text{font-family:var(--font-display-cn);letter-spacing:0.4em;font-size:13px;color:var(--plum-soft);}

/* ============ 爱心粒子背景（全局） ============ */
#heart-particles{position:fixed;inset:0;pointer-events:none;z-index:5;overflow:hidden;}
.heart-particle{
  position:absolute;bottom:-40px;opacity:0;font-size:16px;color:rgba(232,93,117,0.55);
  animation:floatHeart linear infinite;
}
@keyframes floatHeart{
  0%{transform:translateY(0) translateX(0) rotate(0deg) scale(0.6);opacity:0;}
  10%{opacity:0.9;}
  90%{opacity:0.6;}
  100%{transform:translateY(-110vh) translateX(var(--drift,20px)) rotate(360deg) scale(1);opacity:0;}
}

/* ============ 第一页：首页 HERO ============ */
.page{
  min-height:100vh;width:100%;position:relative;
}
#page-hero{
  height:100vh;overflow:hidden;display:flex;align-items:center;justify-content:center;
}
.hero-bg{position:absolute;inset:0;z-index:0;overflow:hidden;}
.hero-backdrop{
  position:absolute;inset:0;
  background:linear-gradient(135deg,#F7A9C4,#E85D75 40%,#B23A5E 70%,#7A2647);
  background-size:220% 220%;
  animation:gradientShift 20s ease-in-out infinite;
}
@keyframes gradientShift{
  0%,100%{background-position:0% 30%;}
  50%{background-position:100% 70%;}
}
.photo-float{
  position:absolute;opacity:0;
  transition:opacity 1.3s ease-in-out;
  will-change:opacity;
}
.photo-float.visible{opacity:1;}
.photo-float-frame{
  width:100%;height:100%;border-radius:20px;overflow:hidden;
  box-shadow:0 25px 60px rgba(74,25,66,0.4), 0 0 0 6px rgba(255,255,255,0.92);
  animation:bobFloat 8s ease-in-out infinite;
  transform:rotate(var(--rot,0deg));
}
.photo-float img{
  width:100%;height:100%;object-fit:cover;display:block;
  animation:kbZoomSlow 15s ease-in-out infinite alternate;
}
@keyframes bobFloat{
  0%,100%{transform:rotate(var(--rot,0deg)) translateY(0);}
  50%{transform:rotate(var(--rot,0deg)) translateY(-16px);}
}
@keyframes kbZoomSlow{
  0%{transform:scale(1);}
  100%{transform:scale(1.13);}
}
.photo-slot-1{ top:9%; left:5%; width:clamp(170px,30vw,420px); height:clamp(220px,38vh,480px); --rot:-4deg; animation-delay:0s; }
.photo-slot-2{ top:7%; right:6%; width:clamp(150px,24vw,340px); height:clamp(190px,30vh,380px); --rot:3deg; }
.photo-slot-3{ bottom:8%; left:20%; width:clamp(160px,27vw,380px); height:clamp(200px,32vh,400px); --rot:-2deg; }
.photo-slot-4{ bottom:9%; right:8%; width:clamp(140px,20vw,300px); height:clamp(170px,25vh,320px); --rot:5deg; }
.photo-slot-2 .photo-float-frame{animation-delay:1.4s;}
.photo-slot-3 .photo-float-frame{animation-delay:2.8s;}
.photo-slot-4 .photo-float-frame{animation-delay:4.2s;}
.hero-overlay{
  position:absolute;inset:0;z-index:2;
  background:
    radial-gradient(ellipse 68% 50% at 50% 42%, rgba(74,25,66,0.55), transparent 68%),
    linear-gradient(180deg, rgba(201,24,74,0.2) 0%, rgba(74,25,66,0.38) 55%, rgba(74,25,66,0.56) 100%);
}
.hero-content{
  position:relative;z-index:3;text-align:center;color:#fff;padding:0 24px;
  display:flex;flex-direction:column;align-items:center;gap:22px;
}
.hero-mark{
  font-size:34px;animation:heartbeat 2.4s ease-in-out infinite;
  filter:drop-shadow(0 6px 18px rgba(0,0,0,0.25));
}
@keyframes heartbeat{0%,100%{transform:scale(1);}15%{transform:scale(1.18);}30%{transform:scale(1);}45%{transform:scale(1.12);}60%{transform:scale(1);}}
.hero-title{
  font-family:var(--font-display-cn);
  font-weight:700;
  font-size:clamp(42px,8vw,88px);
  letter-spacing:0.08em;
  line-height:1.15;
  opacity:0;
  animation:revealUp 1.1s var(--ease) 0.3s forwards;
  text-shadow:0 10px 40px rgba(0,0,0,0.25);
}
.hero-sub{
  font-family:var(--font-display-cn);
  font-weight:400;
  font-size:clamp(15px,2.2vw,20px);
  letter-spacing:0.06em;
  color:rgba(255,255,255,0.92);
  max-width:520px;
  opacity:0;
  animation:revealUp 1.1s var(--ease) 0.6s forwards;
}
@keyframes revealUp{from{opacity:0;transform:translateY(24px);}to{opacity:1;transform:translateY(0);}}
.hero-cta{
  position:relative;margin-top:14px;
  padding:18px 46px;
  border-radius:100px;
  font-size:16px;letter-spacing:0.12em;font-weight:600;
  color:var(--rose-deep);
  background:#fff;
  box-shadow:0 18px 40px rgba(0,0,0,0.25), 0 0 0 0 rgba(255,255,255,0.6);
  overflow:hidden;
  transition:transform 0.45s var(--ease), box-shadow 0.45s var(--ease);
  opacity:0;
  animation:revealUp 1.1s var(--ease) 0.9s forwards;
}
.hero-cta:hover{
  transform:translateY(-4px) scale(1.045);
  box-shadow:0 24px 55px rgba(0,0,0,0.3), 0 0 30px 6px rgba(255,255,255,0.5);
}
.hero-cta .ripple{
  position:absolute;border-radius:50%;background:rgba(232,93,117,0.35);
  transform:scale(0);animation:rippleAnim 0.65s ease-out;
  pointer-events:none;
}
@keyframes rippleAnim{to{transform:scale(3.2);opacity:0;}}
.hero-scroll-hint{
  position:absolute;bottom:34px;left:50%;transform:translateX(-50%);
  z-index:3;color:rgba(255,255,255,0.75);font-size:11px;letter-spacing:0.3em;
  display:flex;flex-direction:column;align-items:center;gap:8px;
  opacity:0;animation:revealUp 1s var(--ease) 1.3s forwards;
}
.hero-scroll-hint .line{width:1px;height:26px;background:rgba(255,255,255,0.6);animation:hintMove 1.8s ease-in-out infinite;}
@keyframes hintMove{0%,100%{transform:scaleY(0.4);opacity:0.4;}50%{transform:scaleY(1);opacity:1;}}


/* ============ 邀请函翻开转场 ============ */
#envelope-transition{
  position:fixed;inset:0;z-index:8000;pointer-events:none;
  display:flex;align-items:center;justify-content:center;
  opacity:0;visibility:hidden;
}
#envelope-transition.show{opacity:1;visibility:visible;}
.envelope-flap{
  position:absolute;inset:0;background:linear-gradient(135deg,var(--blush),var(--rose) 60%,var(--rose-deep));
  transform:scaleY(0);transform-origin:top;
  transition:transform 0.9s var(--ease);
}
#envelope-transition.show .envelope-flap{transform:scaleY(1);}

/* ============ 第二页：预约表单 ============ */
#page-form{
  min-height:100vh;
  background:
    radial-gradient(circle at 15% 10%, rgba(255,198,211,0.5), transparent 40%),
    radial-gradient(circle at 85% 90%, rgba(212,163,115,0.25), transparent 45%),
    linear-gradient(160deg,#FFF8F5,#FFEFF2 45%,#FCE4EC);
  display:none;
  padding:56px 20px 90px;
  position:relative;
}
#page-form.visible{display:block;}

.form-wrap{max-width:720px;margin:0 auto;}
.form-header{text-align:center;margin-bottom:36px;}
.form-header .eyebrow{
  font-size:12px;letter-spacing:0.35em;color:var(--gold);font-weight:600;text-transform:uppercase;
}
.form-header h1{
  font-family:var(--font-display-cn);font-weight:700;font-size:clamp(28px,5vw,38px);
  margin-top:10px;color:var(--plum);
}
.form-header p{margin-top:10px;color:var(--plum-soft);font-size:14px;letter-spacing:0.02em;}

/* 步骤进度 */
.steps-nav{
  display:flex;justify-content:center;gap:10px;margin-bottom:34px;flex-wrap:wrap;
}
.step-pill{
  display:flex;align-items:center;gap:8px;padding:8px 16px 8px 10px;border-radius:100px;
  background:rgba(255,255,255,0.5);border:1px solid rgba(255,255,255,0.8);
  font-size:12.5px;color:var(--plum-soft);transition:all .4s var(--ease);
}
.step-pill .num{
  width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:rgba(74,25,66,0.08);font-size:11px;font-weight:700;color:var(--plum-soft);transition:all .4s var(--ease);
}
.step-pill.active{background:var(--rose-deep);color:#fff;box-shadow:0 8px 22px rgba(201,24,74,0.35);}
.step-pill.active .num{background:rgba(255,255,255,0.25);color:#fff;}
.step-pill.done .num{background:var(--gold);color:#fff;}
.step-pill.done .num::after{content:'✓';}

/* 玻璃卡片 */
.glass-card{
  background:var(--glass-bg);
  border:1px solid var(--glass-border);
  border-radius:28px;
  padding:34px 30px;
  backdrop-filter:blur(22px) saturate(160%);
  -webkit-backdrop-filter:blur(22px) saturate(160%);
  box-shadow:var(--shadow-soft);
  position:relative;
  overflow:hidden;
}
.glass-card::before{
  content:'';position:absolute;top:-60%;left:-20%;width:60%;height:220%;
  background:linear-gradient(120deg, rgba(255,255,255,0.5), transparent 60%);
  transform:rotate(18deg);pointer-events:none;
}
.form-step{display:none;animation:stepIn 0.6s var(--ease);}
.form-step.active{display:block;}
@keyframes stepIn{from{opacity:0;transform:translateY(18px);}to{opacity:1;transform:translateY(0);}}

.step-title{
  font-family:var(--font-display-cn);font-size:22px;font-weight:700;color:var(--plum);
  margin-bottom:6px;display:flex;align-items:center;gap:10px;
}
.step-desc{color:var(--plum-soft);font-size:13.5px;margin-bottom:24px;}

/* 日期选择 */
.date-input-wrap{position:relative;}
input[type="date"]{
  width:100%;padding:18px 20px;border-radius:18px;border:1.5px solid rgba(201,24,74,0.18);
  background:rgba(255,255,255,0.75);font-size:16px;color:var(--plum);
  outline:none;transition:all .35s var(--ease);
}
input[type="date"]:focus{border-color:var(--rose);box-shadow:0 0 0 4px rgba(232,93,117,0.15);}

/* 时间段卡片 */
.time-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px;}
.time-card{
  padding:18px 8px;border-radius:18px;text-align:center;cursor:pointer;
  background:rgba(255,255,255,0.6);border:1.5px solid rgba(201,24,74,0.1);
  transition:all .35s var(--ease);
}
.time-card .emoji{font-size:26px;display:block;margin-bottom:8px;transition:transform .35s var(--ease);}
.time-card .label{font-size:13px;color:var(--plum-soft);font-weight:500;}
.time-card:hover{transform:translateY(-4px);box-shadow:0 12px 26px rgba(201,24,74,0.12);}
.time-card.selected{background:linear-gradient(160deg,var(--rose),var(--rose-deep));border-color:transparent;box-shadow:0 14px 30px rgba(201,24,74,0.35);}
.time-card.selected .label{color:#fff;}
.time-card.selected .emoji{transform:scale(1.15);}
.custom-time-toggle{
  text-align:center;font-size:13px;color:var(--rose-deep);text-decoration:underline;cursor:pointer;margin-bottom:12px;
}
input[type="time"]{
  width:100%;padding:16px 20px;border-radius:16px;border:1.5px solid rgba(201,24,74,0.18);
  background:rgba(255,255,255,0.75);font-size:15px;color:var(--plum);outline:none;display:none;
}
input[type="time"].show{display:block;animation:stepIn .4s var(--ease);}

/* 卡片式选择网格（活动 / 餐点） */
.choice-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px;
  max-height:420px;overflow-y:auto;padding:4px 4px 8px 2px;margin-bottom:6px;
}
.choice-grid::-webkit-scrollbar{width:5px;}
.choice-grid::-webkit-scrollbar-thumb{background:rgba(201,24,74,0.25);border-radius:10px;}
.choice-card{
  padding:14px 6px;border-radius:16px;text-align:center;cursor:pointer;
  background:rgba(255,255,255,0.55);border:1.5px solid rgba(201,24,74,0.08);
  transition:transform .3s var(--ease), box-shadow .3s var(--ease), background .3s var(--ease);
  display:flex;flex-direction:column;align-items:center;gap:6px;
}
.choice-card .emoji{font-size:22px;transition:transform .3s var(--ease);}
.choice-card .label{font-size:11.5px;color:var(--plum-soft);font-weight:500;line-height:1.3;}
.choice-card:hover{transform:translateY(-3px) scale(1.03);box-shadow:0 10px 22px rgba(201,24,74,0.14);}
.choice-card.selected{
  background:linear-gradient(160deg,var(--rose),var(--rose-deep));border-color:transparent;
  box-shadow:0 12px 26px rgba(201,24,74,0.32);
  animation:pop .35s var(--ease);
}
.choice-card.selected .label{color:#fff;}
.choice-card.selected .emoji{transform:scale(1.2) rotate(-4deg);}
@keyframes pop{0%{transform:scale(0.9);}55%{transform:scale(1.08);}100%{transform:scale(1);}}

.subsection{
  margin-top:26px;padding-top:22px;border-top:1px dashed rgba(201,24,74,0.2);
  overflow:hidden;max-height:0;opacity:0;transition:max-height .6s var(--ease), opacity .5s var(--ease), margin .5s var(--ease), padding .5s var(--ease);
}
.subsection.open{max-height:900px;opacity:1;}

textarea{
  width:100%;min-height:120px;padding:18px 20px;border-radius:18px;border:1.5px solid rgba(201,24,74,0.18);
  background:rgba(255,255,255,0.75);font-size:14.5px;color:var(--plum);outline:none;resize:vertical;
  line-height:1.7;transition:all .35s var(--ease);
}
textarea::placeholder{color:rgba(122,66,102,0.5);}
textarea:focus{border-color:var(--rose);box-shadow:0 0 0 4px rgba(232,93,117,0.15);}

/* 按钮组 */
.btn-row{display:flex;justify-content:space-between;gap:14px;margin-top:30px;}
.btn{
  padding:15px 30px;border-radius:100px;font-size:14.5px;font-weight:600;letter-spacing:0.04em;
  transition:all .35s var(--ease);position:relative;overflow:hidden;
}
.btn-primary{
  background:linear-gradient(135deg,var(--rose),var(--rose-deep));color:#fff;
  box-shadow:0 14px 30px rgba(201,24,74,0.32);flex:1;
}
.btn-primary:hover{transform:translateY(-3px);box-shadow:0 20px 40px rgba(201,24,74,0.4);}
.btn-primary:disabled{opacity:0.45;cursor:not-allowed;transform:none;box-shadow:none;}
.btn-ghost{
  background:rgba(255,255,255,0.5);color:var(--plum-soft);border:1.5px solid rgba(74,25,66,0.12);
}
.btn-ghost:hover{background:rgba(255,255,255,0.85);}

/* 摘要卡片 */
.summary-list{display:flex;flex-direction:column;gap:0;margin-bottom:10px;}
.summary-row{
  display:flex;justify-content:space-between;gap:16px;padding:16px 4px;border-bottom:1px solid rgba(201,24,74,0.1);
  font-size:14px;
}
.summary-row:last-child{border-bottom:none;}
.summary-row .k{color:var(--plum-soft);display:flex;align-items:center;gap:8px;white-space:nowrap;}
.summary-row .v{color:var(--plum);font-weight:600;text-align:right;}
.summary-note{
  margin-top:6px;padding:16px 18px;border-radius:16px;background:rgba(255,255,255,0.5);
  font-size:13.5px;color:var(--plum-soft);line-height:1.7;
}

/* ============ 成功画面 ============ */
#page-success{
  position:fixed;inset:0;z-index:7000;
  display:none;align-items:center;justify-content:center;flex-direction:column;
  background:radial-gradient(circle at 50% 30%, #FFC6D3, #C9184A 75%);
  color:#fff;text-align:center;overflow:hidden;
}
#page-success.visible{display:flex;}
#confetti-canvas{position:absolute;inset:0;pointer-events:none;}
.success-inner{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:16px;padding:0 24px;}
.success-heart{font-size:64px;animation:successPop 0.9s var(--ease);filter:drop-shadow(0 10px 30px rgba(0,0,0,0.25));}
@keyframes successPop{0%{transform:scale(0);opacity:0;}60%{transform:scale(1.25);opacity:1;}100%{transform:scale(1);}}
.success-title{
  font-family:var(--font-display-cn);font-size:clamp(30px,6vw,46px);font-weight:700;
  opacity:0;animation:revealUp 0.8s var(--ease) 0.35s forwards;
}
.success-sub{font-size:15px;letter-spacing:0.05em;opacity:0;animation:revealUp 0.8s var(--ease) 0.55s forwards;color:rgba(255,255,255,0.92);}
.success-btn{
  margin-top:10px;padding:14px 34px;border-radius:100px;background:#fff;color:var(--rose-deep);
  font-size:14px;font-weight:600;letter-spacing:0.06em;opacity:0;animation:revealUp 0.8s var(--ease) 0.8s forwards;
  transition:transform .35s var(--ease);
}
.success-btn:hover{transform:translateY(-3px) scale(1.04);}

/* 状态提示（发送中/错误） */
.send-status{
  text-align:center;font-size:12.5px;color:var(--plum-soft);margin-top:10px;min-height:16px;
}
.send-status.error{color:var(--rose-deep);}

@media (max-width:560px){
  .time-grid{grid-template-columns:repeat(3,1fr);}
  .choice-grid{grid-template-columns:repeat(auto-fill,minmax(82px,1fr));}
  .glass-card{padding:26px 18px;border-radius:22px;}
  .btn-row{flex-direction:column-reverse;}
  .photo-slot-1{ top:6%; left:4%; width:44vw; height:24vh; }
  .photo-slot-2{ top:5%; right:4%; width:38vw; height:20vh; }
  .photo-slot-3{ bottom:6%; left:14%; width:42vw; height:22vh; }
  .photo-slot-4{ bottom:22%; right:10%; width:36vw; height:18vh; }
}
</style>

</head>
<body>

<!-- 页面载入动画 -->
<div id="loader">
  <div class="loader-heart"></div>
  <div class="loader-text">邀 请 函 准 备 中</div>
</div>

<!-- 全局爱心粒子 -->
<div id="heart-particles"></div>

<!-- 邀请函翻开转场 -->
<div id="envelope-transition"><div class="envelope-flap"></div></div>

<!-- ============ 第一页：首页 ============ -->
<section class="page" id="page-hero">
  <div class="hero-bg" id="heroBg">
    <div class="hero-backdrop"></div>

/* ================================================================

   ================================================================ */
const PHOTO_COUNT = 20; // images/1.jpeg ~ images/20.jpeg，可自行增减数量
const PHOTO_EXTS = ["jpeg","jpg","png","webp"];
const photoTiles = [
  document.getElementById("photoSlot0"),
  document.getElementById("photoSlot1"),
  document.getElementById("photoSlot2"),
  document.getElementById("photoSlot3"),
];

function tryLoadPhoto(index){
  return new Promise(resolve=>{
    let extIdx = 0;
    function attempt(){
      if(extIdx >= PHOTO_EXTS.length){ resolve(null); return; }
      const url = `images/${index}.${PHOTO_EXTS[extIdx]}`;
      const img = new Image();
      img.onload = ()=> resolve(url);
      img.onerror = ()=>{ extIdx++; attempt(); };
      img.src = url;
    }
    attempt();
  });
}

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}
function sameSet(a,b){
  if(a.length !== b.length) return false;
  const sa = [...a].sort(), sb = [...b].sort();
  return sa.every((v,i)=> v===sb[i]);
}

(async function initPhotoBackground(){
  const indices = Array.from({length:PHOTO_COUNT}, (_,i)=> i+1);
  const results = await Promise.all(indices.map(tryLoadPhoto));
  const availablePhotos = results.filter(Boolean); // 只保留成功载入的照片

  if(availablePhotos.length === 0){
    // 没有任何照片时，静静展示渐层背景，不显示浮动相框
    return;
  }

  let currentSet = [];
  function refreshPhotos(){
    const n = Math.min(3, availablePhotos.length);
    let newSet;
    let tries = 0;
    do{
      newSet = shuffle(availablePhotos).slice(0, n); // 同一批内不会重复
      tries++;
    } while(tries < 8 && sameSet(newSet, currentSet) && availablePhotos.length > n);
    currentSet = newSet;

    // 先淡出目前显示的相框
    photoTiles.forEach(tile=> tile.classList.remove("visible"));

    setTimeout(()=>{
      photoTiles.forEach((tile, i)=>{
        if(i < newSet.length){
          const img = tile.querySelector("img");
          img.src = newSet[i];
          tile.classList.add("visible");
        } else {
          tile.classList.remove("visible");
        }
      });
    }, 700);
  }

  refreshPhotos();
  setInterval(refreshPhotos, 5000);
})();

function attachRipple(btn){
  btn.addEventListener("click", (e)=>{
    const rect = btn.getBoundingClientRect();
    const ripple = document.createElement("span");
    ripple.className = "ripple";
    const size = Math.max(rect.width, rect.height);
    ripple.style.width = ripple.style.height = size+"px";
    ripple.style.left = (e.clientX - rect.left - size/2)+"px";
    ripple.style.top = (e.clientY - rect.top - size/2)+"px";
    btn.appendChild(ripple);
    setTimeout(()=>ripple.remove(), 650);
  });
}

});

function runConfetti(){
  const canvas = document.getElementById("confetti-canvas");
  const ctx = canvas.getContext("2d");
  function resize(){ canvas.width = innerWidth; canvas.height = innerHeight; }
  resize();
  window.addEventListener("resize", resize);
  const colors = ["#ffffff","#FFD1DC","#FFC6D3","#F1E3D3","#E85D75"];
  const shapes = ["heart","circle","rect"];
  const particles = Array.from({length:90}, ()=>({
    x: Math.random()*canvas.width,
    y: -20 - Math.random()*canvas.height*0.5,
    vx: (Math.random()-0.5)*2.2,
    vy: 2 + Math.random()*3,
    size: 6 + Math.random()*8,
    rot: Math.random()*360,
    vr: (Math.random()-0.5)*8,
    color: colors[Math.floor(Math.random()*colors.length)],
    shape: shapes[Math.floor(Math.random()*shapes.length)],
    life: 0
  }));
  function drawHeart(x,y,size,color,rot){
    ctx.save();
    ctx.translate(x,y);
    ctx.rotate(rot*Math.PI/180);
    ctx.fillStyle = color;
    ctx.beginPath();
    const s = size/2;
    ctx.moveTo(0, s*0.3);
    ctx.bezierCurveTo(0,-s*0.3, -s,-s*0.3, -s,s*0.1);
    ctx.bezierCurveTo(-s,s*0.6, 0,s*0.9, 0,s*1.3);
    ctx.bezierCurveTo(0,s*0.9, s,s*0.6, s,s*0.1);
    ctx.bezierCurveTo(s,-s*0.3, 0,-s*0.3, 0,s*0.3);
    ctx.fill();
    ctx.restore();
  }
  let frame = 0;
  const maxFrames = 260;
  function animate(){
    frame++;
    ctx.clearRect(0,0,canvas.width,canvas.height);
    particles.forEach(p=>{
      p.x += p.vx; p.y += p.vy; p.rot += p.vr; p.life++;
      const alpha = frame < maxFrames-60 ? 1 : Math.max(0,(maxFrames-frame)/60);
      ctx.globalAlpha = alpha;
      if(p.shape === "heart"){ drawHeart(p.x,p.y,p.size,p.color,p.rot); }
      else if(p.shape === "circle"){
        ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(p.x,p.y,p.size/2,0,Math.PI*2); ctx.fill();
      } else {
        ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot*Math.PI/180);
        ctx.fillStyle = p.color; ctx.fillRect(-p.size/2,-p.size/2,p.size,p.size*0.5); ctx.restore();
      }
    });
    ctx.globalAlpha = 1;
    if(frame < maxFrames) requestAnimationFrame(animate);
    else ctx.clearRect(0,0,canvas.width,canvas.height);
  }
  animate();
}
